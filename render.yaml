# Render Blueprint: deploy as a Docker web service so the PO-token provider runs next to the API.
services:
  - type: web
    name: downflow
    runtime: docker
    plan: starter            # free instances sleep and are easy for sites to flag; use a paid plan
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8000"
      - key: DOWNFLOW_ADMIN_USER
        sync: false
      - key: DOWNFLOW_ADMIN_PASS
        sync: false
      - key: DOWNFLOW_SECRET
        generateValue: true
      - key: DOWNFLOW_TURSO_URL        # libsql://downflow-database-sonicore.aws-ap-northeast-1.turso.io
        sync: false
      - key: DOWNFLOW_TURSO_TOKEN      # paste the token in the Render dashboard (never in git)
        sync: false
      - key: DOWNFLOW_PROXY            # residential/rotating proxy, see README (use {sid} for sticky sessions)
        sync: false
      - key: DOWNFLOW_STORE_KEY        # encrypts cookies in the database; set once, never change
        sync: false
      - key: DOWNFLOW_COOKIE_POLICY
        value: last
      - key: DOWNFLOW_AUTO_UPDATE
        value: stable
