<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Downflow</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/ui.css">
<style>

.admin{font-size:13.5px}.admin .mono,.admin .kv span,.admin table,.admin .v{font-family:var(--mono)}
.ph.row2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:var(--gap);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none;width:fit-content;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:transparent;border:0;color:var(--muted);cursor:pointer;font:500 13.5px var(--sans);white-space:nowrap}
.tab:hover{color:var(--text)}.tab.on{color:#fff;background:#1f1f27}
#cards{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:720px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:18px 20px}@media(max-width:640px){.stat{padding:14px}.stat .v{font-size:20px}}.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.stat .v{font-size:24px;font-weight:650;margin-top:4px;letter-spacing:-.5px}
.v.g{color:var(--ok)}.v.c{color:var(--cyan)}.v.p{color:var(--pink)}.v.y{color:var(--warn)}.v.r{color:var(--bad)}.v.vi{color:var(--vio)}
.sec{margin:28px 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.bar{height:6px;border-radius:9px;background:#1a2130;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--cyan))}
canvas{width:100%;height:60px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}.ok{color:var(--ok)}.no{color:var(--bad)}
/* terminal */
.term{background:#050507;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0b0f16;border-bottom:1px solid var(--line)}
.tbar select,.tbar input{width:auto;padding:6px 9px;font:12px var(--mono)}.tbar input{flex:1;min-width:120px}
.lights i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#log{height:min(70vh,680px);height:min(70dvh,680px);overflow:auto;padding:10px 12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font:11px var(--mono);touch-action:pan-y;overscroll-behavior:contain}
.ln{display:flex;gap:9px}.ln .t{color:#566074;flex:none}.ln .lv{flex:none;width:3.2em;text-align:center;border-radius:4px;font-size:.85em;font-weight:700;align-self:flex-start;margin-top:.15em;padding:1px 0}
.ln .nm{flex:none;width:6.5em;font-weight:700}.ln .m{flex:1;min-width:0}
.L-INFO{background:#14532d;color:#bbf7d0}.L-WARNING{background:#854d0e;color:#fef08a}.L-ERROR,.L-CRITICAL{background:#7f1d1d;color:#fecaca}.L-DEBUG{background:#27272a;color:#a1a1aa}
.mW{color:#fde68a}.mE{color:#fca5a5}.u{color:#60a5fa;text-decoration:underline}.n{color:#fbbf24;font-weight:700}.tg{font-weight:800}
/* tester */
.req{display:flex;gap:8px;margin-bottom:10px}.req select{width:100px}.req input{flex:1}
textarea{min-height:170px;font:12px var(--mono);resize:vertical}
pre.out{background:#05070b;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px}
.m-GET{color:var(--ok)}.m-POST{color:var(--warn)}.m-DELETE{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}
td.w{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-completed{color:var(--ok)}.s-failed{color:var(--bad)}.s-processing{color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px}.kv b{color:var(--muted);font-weight:500}.kv span{overflow-wrap:anywhere}

@media(max-width:820px){.req select{width:92px}pre.out{max-height:60vh}textarea{min-height:140px}}
@media(max-width:640px){
 #log{height:62dvh;padding:8px 10px}
 .ln{gap:6px}.ln .t{display:none}.ln .nm{width:5.2em}
 .tbar{padding:8px 10px}.tbar input{flex:1 1 100%;order:5}.lights{display:none}
 .tbar .btn{padding:7px 10px}
 .kv{grid-template-columns:minmax(0,1fr);gap:2px}.kv b{margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
 td.w{max-width:180px}th,td{padding:8px}
 .tabs{width:100%}
}
</style></head><body>
<!--HEADER-->
<main class="page admin">
<div class="ph row2"><div><h1 id="title">Overview</h1><p>Server health, live logs and developer tools.</p></div><span class="chip"><span class="dot ok" id="live"></span><span id="up">…</span></span></div>
<div class="tabs" id="tabs"></div>
<section data-tab="Overview">
 <div class="grid" id="cards"></div>
 <div class="sec">Throughput</div><div class="card"><canvas id="spark" width="900" height="60"></canvas><div class="muted" id="rate" style="margin-top:6px"></div></div>
 <div class="split" style="margin-top:14px"><div><div class="sec">System</div><div class="card kv" id="sys"></div></div>
 <div><div class="sec">Capabilities</div><div class="card"><div class="chips" id="tools"></div><div class="sec" style="margin-top:16px">Platforms served</div><div class="chips" id="plats"></div></div></div></div>
</section>
<section data-tab="Logs" class="hidden">
 <div class="term"><div class="tbar"><span class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
 <select id="lvl"><option value="">all levels</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select>
 <input id="q" placeholder="filter…"><button class="btn ghost" id="fm" title="Smaller (Ctrl+scroll or pinch)">A−</button><span class="chip" id="fsv">11px</span><button class="btn ghost" id="fp" title="Larger (Ctrl+scroll or pinch)">A+</button><button class="btn ghost" id="pause">Pause</button><button class="btn ghost" id="clr">Clear</button><button class="btn ghost" id="dl">Save .txt</button></div>
 <div id="log"></div></div>
</section>
<section data-tab="API Tester" class="hidden">
 <div class="split"><div class="card"><label>Preset route</label><select id="preset" style="margin-bottom:10px"></select>
 <div class="req"><select id="meth"><option>GET</option><option>POST</option><option>DELETE</option></select><input id="path" value="/api/v1/health/"></div>
 <label>JSON body</label><textarea id="body" spellcheck="false"></textarea><div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn" id="send">Send ▸</button><span class="muted" id="meta"></span></div></div>
 <div class="card"><label>Response</label><pre class="out" id="out">Send a request…</pre></div></div>
</section>
<section data-tab="Tasks" class="hidden"><div class="card" style="overflow:auto"><table><thead><tr><th>Status</th><th>Platform</th><th>Title / URL</th><th>Stage</th><th>Created</th><th>Task</th></tr></thead><tbody id="tasks"></tbody></table></div></section>
<section data-tab="Config" class="hidden"><div class="card kv" id="cfg"></div></section>
</main>
<!--FOOTER-->
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(p,o)=>{const r=await fetch(p,o);if(r.status===401){location.href="/login?next=/admin";throw Error("auth")}return r};
const jget=async p=>(await api(p)).json();
const fmtB=n=>{n=+n||0;const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]};
const fmtT=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"d ":"")+(h?h+"h ":"")+m+"m "+(s%60)+"s"};
// tabs
const ICON={Overview:"▦",Logs:"❯_","API Tester":"⚡",Tasks:"☰",Config:"⚙"};
const secs=[...document.querySelectorAll("section[data-tab]")];
secs.forEach(s=>{const b=document.createElement("button");b.className="tab";b.textContent=ICON[s.dataset.tab]+"  "+s.dataset.tab;b.dataset.n=s.dataset.tab;b.onclick=()=>show(s.dataset.tab);$("tabs").append(b)});
function show(n){secs.forEach(s=>s.classList.toggle("hidden",s.dataset.tab!==n));[...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.n===n));$("title").textContent=n;
 try{localStorage.setItem("adm_tab",n)}catch(e){}if(n==="Tasks")loadTasks();if(n==="Config")loadCfg();if(n==="Logs")scroll()}
let saved="Overview";try{saved=localStorage.getItem("adm_tab")||saved}catch(e){}
// overview
let lastBytes=null,series=[];
const card=(k,v,c)=>`<div class="card stat"><div class="k">${k}</div><div class="v ${c||""}">${v}</div></div>`;
async function stats(){try{const s=await jget("/api/v1/admin/stats"),c=s.counters,ok=c.extract_ok||0,bad=c.extract_fail||0,tot=ok+bad;
 $("up").textContent="up "+fmtT(s.uptime);$("live").className="dot ok";
 $("cards").innerHTML=card("Extractions ok",ok,"g")+card("Failed",bad,bad?"r":"")+card("Success rate",tot?Math.round(ok/tot*100)+"%":"—","c")+card("Cache hits",c.cache_hits||0,"vi")
  +card("Active downloads",c.downloads_active||0,"y")+card("Downloads total",c.downloads_started||0,"p")+card("Data sent",fmtB(c.bytes_sent),"c")+card("Tasks active / total",s.tasks_active+" / "+s.tasks_in_memory,"");
 const m=s.system.memory,l=s.system.load;
 $("sys").innerHTML=`<b>python</b><span>${esc(s.system.python)}</span><b>platform</b><span>${esc(s.system.platform)}</span><b>cpus</b><span>${s.system.cpus}</span><b>pid</b><span>${s.system.pid}</span>`
  +(l?`<b>load</b><span>${l.map(x=>x.toFixed(2)).join(" · ")}</span>`:"")+(m?`<b>memory</b><span>${fmtB(m.used)} / ${fmtB(m.total)}<div class="bar"><i style="width:${Math.round(m.used/m.total*100)}%"></i></div></span>`:"");
 const t=s.tools,chip=(n,v)=>`<span class="chip"><span class="${v?"ok":"no"}">${v?"●":"○"}</span> ${n}${v&&v!==true?" "+esc(String(v).slice(0,34)):""}</span>`;
 $("tools").innerHTML=chip("yt-dlp",t.yt_dlp)+chip("ffmpeg",!!t.ffmpeg)+chip("node",t.node)+chip("deno",t.deno)+chip("curl_cffi",t.curl_cffi);
 $("plats").innerHTML=Object.entries(s.platforms).map(([k,v])=>`<span class="chip">${esc(k)} <b class="ok">${v}</b></span>`).join("")||'<span class="muted">none yet</span>';
 const b=c.bytes_sent||0;if(lastBytes!==null){series.push(Math.max(0,(b-lastBytes)/3));series=series.slice(-60)}lastBytes=b;spark()}catch(e){$("live").className="dot bad"}}
function spark(){const cv=$("spark"),x=cv.getContext("2d"),w=cv.width,h=cv.height;x.clearRect(0,0,w,h);if(series.length<2)return;const mx=Math.max(1,...series);
 x.beginPath();series.forEach((v,i)=>{const px=i/(series.length-1)*w,py=h-4-(v/mx)*(h-10);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle="#22d3ee";x.lineWidth=2;x.stroke();
 x.lineTo(w,h);x.lineTo(0,h);x.closePath();const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#22d3ee55");g.addColorStop(1,"#22d3ee00");x.fillStyle=g;x.fill();$("rate").textContent="now "+fmtB(series[series.length-1])+"/s · peak "+fmtB(mx)+"/s"}
// logs
const MOD={engine:"#38bdf8",api:"#f472b6",stealth:"#a78bfa",download:"#fb923c",retry:"#fbbf24",config:"#67e8f9",access:"#94a3b8",error:"#f87171",downflow:"#7dd3fc"};
const TAG={start:"#22d3ee",try:"#60a5fa",ok:"#4ade80",done:"#34d399",block:"#fb923c",failed:"#f87171",send:"#f472b6",fetch:"#7dd3fc",direct:"#fb923c",merge:"#c084fc"};
function paint(m){let h=esc(m);h=h.replace(/^(\w+)(\s)/,(a,w,s)=>TAG[w]?`<span class="tg" style="color:${TAG[w]}">${w}</span>${s}`:a);
 h=h.replace(/(https?:\/\/[^\s<]+)/g,'<span class="u">$1</span>').replace(/(^|[\s(])(\d+(?:\.\d+)?\s?(?:s|ms|MB|KB|GB|%))(?![\w])/g,'$1<span class="n">$2</span>').replace(/\b(\d+\/\d+)\b/g,'<span style="color:#c084fc">$1</span>').replace(/-&gt;/g,'<span style="color:#fb7185">→</span>')
 .replace(/"(GET|POST|PUT|DELETE)\s(\S+)\s(HTTP\/[\d.]+)"\s(\d{3})/,(a,v,p,pr,c)=>`<b style="color:${v=="GET"?"#4ade80":"#fbbf24"}">${v}</b> ${p} <span class="muted">${pr}</span> <b style="color:${c<300?"#4ade80":c<400?"#60a5fa":c<500?"#fbbf24":"#f87171"}">${c}</b>`);return h}
let logs=[],after=0,paused=false;const box=$("log");
function line(r){const d=document.createElement("div");d.className="ln";const lv={INFO:"INF",WARNING:"WRN",ERROR:"ERR",CRITICAL:"CRT",DEBUG:"DBG"}[r.level]||r.level;
 d.innerHTML=`<span class="t">${r.t}</span><span class="lv L-${r.level}">${lv}</span><span class="nm" style="color:${MOD[r.name]||"#94a3b8"}">${esc(r.name)}</span><span class="m ${r.level=="WARNING"?"mW":r.level=="ERROR"||r.level=="CRITICAL"?"mE":""}">${paint(r.msg)}</span>`;return d}
const ok=r=>(!$("lvl").value||r.level===$("lvl").value)&&(!$("q").value||(r.msg+r.name).toLowerCase().includes($("q").value.toLowerCase()));
function scroll(){box.scrollTop=box.scrollHeight}
function redraw(){box.textContent="";logs.filter(ok).forEach(r=>box.append(line(r)));scroll()}
async function pull(){if(paused)return;try{const j=await jget("/api/v1/admin/logs?after="+after);if(!j.logs.length)return;const stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
 j.logs.forEach(r=>{after=Math.max(after,r.id);logs.push(r);if(ok(r))box.append(line(r))});logs=logs.slice(-1500);while(box.children.length>1500)box.firstChild.remove();if(stick)scroll()}catch(e){}}
$("lvl").onchange=$("q").oninput=redraw;
$("pause").onclick=function(){paused=!paused;this.textContent=paused?"Resume":"Pause"};
$("clr").onclick=async()=>{await api("/api/v1/admin/logs/clear",{method:"POST"});logs=[];box.textContent=""};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([logs.map(r=>`${r.t} ${r.level} ${r.name} ${r.msg}`).join("\n")]));a.download="downflow-logs.txt";a.click()};
// terminal zoom: A-/A+ buttons, Ctrl/Cmd+wheel, two-finger pinch (saved per device)
let fs=11;try{fs=+localStorage.getItem("adm_fs")||11}catch(e){}
function setFs(v){fs=Math.round(Math.max(8,Math.min(22,v))*2)/2;box.style.fontSize=fs+"px";$("fsv").textContent=fs+"px";try{localStorage.setItem("adm_fs",fs)}catch(e){}}
setFs(fs);$("fm").onclick=()=>setFs(fs-1);$("fp").onclick=()=>setFs(fs+1);$("fsv").onclick=()=>setFs(11);
box.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setFs(fs-Math.sign(e.deltaY)*.5)}},{passive:false});
let pd=0,pf=fs;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
box.addEventListener("touchstart",e=>{if(e.touches.length===2){pd=dist(e);pf=fs}},{passive:true});
box.addEventListener("touchmove",e=>{if(e.touches.length===2&&pd){e.preventDefault();setFs(pf*dist(e)/pd)}},{passive:false});
box.addEventListener("touchend",()=>{pd=0});
// tester
let routes=[];
async function loadRoutes(){const j=await jget("/api/v1/admin/routes");routes=j.routes;$("preset").innerHTML='<option value="">— choose —</option>'+routes.map((r,i)=>`<option value="${i}">${r.method} ${r.path}</option>`).join("")}
$("preset").onchange=function(){const r=routes[this.value];if(!r)return;$("meth").value=r.method;$("path").value=r.path;$("body").value=r.body||""};
$("send").onclick=async()=>{const m=$("meth").value,o={method:m,headers:{Accept:"application/json"}};if(m!=="GET"&&$("body").value.trim()){o.headers["Content-Type"]="application/json";o.body=$("body").value}
 $("out").textContent="…";const t0=performance.now();try{const r=await fetch($("path").value,o);const txt=await r.text();let pretty=txt;try{pretty=JSON.stringify(JSON.parse(txt),null,2)}catch(e){}
 $("meta").innerHTML=`<b class="${r.ok?"ok":"no"}">${r.status} ${esc(r.statusText)}</b> · ${Math.round(performance.now()-t0)} ms · ${fmtB(txt.length)}`;$("out").textContent=pretty.slice(0,200000)}catch(e){$("out").textContent=String(e);$("meta").textContent="failed"}};
// tasks/config
async function loadTasks(){const j=await jget("/api/v1/admin/tasks");$("tasks").innerHTML=j.tasks.map(t=>`<tr><td class="s-${t.status}">${t.status}${t.error?" · "+esc(t.error):""}</td><td>${esc(t.platform||"—")}</td><td class="w" title="${esc(t.url||"")}">${esc(t.title||t.url||"—")}</td><td>${esc(t.stage)}</td><td>${new Date(t.created).toLocaleTimeString()}</td><td class="muted">${t.task_id.slice(0,8)}…</td></tr>`).join("")||'<tr><td colspan="6" class="muted">No tasks yet</td></tr>'}
async function loadCfg(){const j=await jget("/api/v1/admin/config");$("cfg").innerHTML=Object.entries(j).map(([k,v])=>`<b>${esc(k)}</b><span>${esc(Array.isArray(v)?v.join(", ")||"—":v)}</span>`).join("")}
show(saved);stats();loadRoutes();pull();
setInterval(stats,3000);setInterval(pull,1000);setInterval(()=>{if(!secs[3].classList.contains("hidden"))loadTasks()},4000);
</script></body></html>
