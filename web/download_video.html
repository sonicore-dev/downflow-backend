<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/ui.css">

    <title>Download · Downflow</title>

    <style>
        :root { --bg:#09090b; --card:#111114; --line:#212126; --muted:#8d8d98; --text:#ededef; --acc:#6366f1; --acc2:#8b5cf6; --warn:#fbbf24; --bad:#fb7185; }
        .subtitle { color:var(--muted); font-size:14px; }
        .card { margin-bottom:0; }
        #result > .card, #statusCard { margin-top:var(--gap); }
        label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; }
        input[type=text], input[type=url], select { width:100%; padding:13px 14px; background:#0d1017; color:var(--text); border:1px solid var(--line); border-radius:10px; font-size:15px; transition:border-color .15s; }
        input:focus, select:focus { outline:0; border-color:var(--acc); }
        button:focus-visible, a.btn:focus-visible { outline:2px solid var(--acc2); outline-offset:2px; }
        .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-top:14px; }
        .field { flex:1 1 220px; min-width:0; }
        .toggle { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); text-transform:none; letter-spacing:0; margin:0; padding-bottom:13px; cursor:pointer; }
        .toggle input { width:18px; height:18px; accent-color:var(--acc); }
        button, a.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border:0; border-radius:10px; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; transition:transform .1s, filter .15s; }
        button:hover:not(:disabled), a.btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
        button:disabled { opacity:.55; cursor:progress; }
        button.secondary, a.btn.secondary { background:#1e2431; color:var(--text); font-weight:600; padding:7px 12px; font-size:13px; border:1px solid var(--line); }
        a.btn.big { padding:16px 28px; font-size:17px; width:100%; border-radius:12px; box-shadow:0 6px 24px #6366f155; }
        .hidden { display:none !important; }
        .msg { padding:12px 14px; border-radius:10px; font-size:14px; margin-top:var(--gap); }
        .msg.error { background:#2b1519; border:1px solid #6b2630; color:#fecdd3; }
        .msg.success { background:#0f2a1b; border:1px solid #1d6b3d; color:#bbf7d0; }
        nav a{color:var(--muted)} nav a:hover{color:var(--text)}
        .msg.note { background:#111a28; border:1px solid #243449; color:#bcd0ea; margin:10px 0 0; }
        .summary { display:flex; gap:18px; flex-wrap:wrap; }
        .thumb { width:260px; max-width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px; background:#0d1017; }
        .info { flex:1 1 260px; min-width:0; }
        .info h2 { font-size:20px; margin-bottom:10px; overflow-wrap:anywhere; }
        dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; font-size:14px; }
        dt { color:var(--muted); } dd { overflow-wrap:anywhere; }
        a { color:var(--acc2); }
        h3 { font-size:16px; margin-bottom:12px; }
        .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; background:#1e2431; color:#d6dbe5; margin:0 6px 4px 0; }
        .badge.warn { background:#3b2f12; color:var(--warn); }
        .stream { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
        .stream-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
        .url-box { width:100%; padding:9px 10px; background:#0d1017; border:1px solid var(--line); border-radius:8px; color:#cfd6e3; font:12px/1.4 monospace; word-break:break-all; max-height:96px; overflow:auto; }
        details { margin-top:10px; font-size:13px; color:var(--muted); }
        details summary { cursor:pointer; }
        details pre { margin-top:6px; padding:8px; background:#0d1017; border-radius:8px; white-space:pre-wrap; word-break:break-all; color:#cfd6e3; }
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
        th { color:var(--muted); font-weight:600; }
        tr.picked td { background:#0f2a1b; }
        .status-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
        .dot { width:12px; height:12px; border-radius:50%; background:var(--muted); flex:none; }
        .dot.processing { background:var(--warn); animation:pulse 1.1s ease-in-out infinite; }
        .dot.completed { background:#22c55e; } .dot.failed { background:var(--bad); }
        @keyframes pulse { 50% { opacity:.35; } }
        .stage-label { font-weight:700; }
        .bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin:8px 0 12px; }
        .bar > span { display:block; height:100%; width:35%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:99px; }
        .bar.indeterminate > span { animation:slide 1.3s ease-in-out infinite; }
        @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
        .bar.done > span { width:100%; animation:none; margin:0; }
        .bar.failed > span { width:100%; animation:none; margin:0; background:var(--bad); }
        .stages { list-style:none; font-size:13px; color:var(--muted); }
        .stages li { padding:2px 0; }
        .stages li::before { content:"\2713  "; color:var(--acc); }
        .stages li.current { color:var(--text); } .stages li.current::before { content:"\2022  "; color:var(--warn); }
        .stages li.failed { color:#fecdd3; } .stages li.failed::before { content:"\00d7  "; color:var(--bad); }
        .meta { font-size:12px; color:var(--muted); margin-top:8px; word-break:break-all; }
        .json-actions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
        pre.json { max-height:480px; overflow:auto; padding:12px; background:#0d1017; border:1px solid var(--line); border-radius:10px; font:12px/1.5 monospace; color:#cfd6e3; white-space:pre-wrap; word-break:break-all; }
        details.json-card > summary { font-size:16px; font-weight:700; color:var(--text); }
        .dl-hint { color:var(--muted); font-size:12.5px; text-align:center; margin-top:10px; }
        @media (max-width:560px) { .thumb { width:100%; } button { width:100%; } button.secondary { width:auto; } }
    
        @media (max-width:820px) { .summary { flex-direction:column; } .thumb { width:100%; max-width:none; } .info { flex:1 1 auto; } }
        @media (max-width:640px) { dl { grid-template-columns:minmax(0,1fr); gap:0; } dt { margin-top:8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
            .stream-head { flex-direction:column; align-items:stretch; } .stream-head .btn, .stream-head button { width:100%; }
            a.btn.big { padding:16px; font-size:16px; } .row { gap:10px; } .field { flex-basis:100%; } .toggle { padding-bottom:0; } th, td { padding:8px 6px; } }
    </style>
</head>
<body>
<!--HEADER-->
<main class="page">
    <div class="ph"><h1>Download</h1><p>Paste a video link, choose quality and format, and save the file straight to your device.</p></div>

    <form id="form" class="card" autocomplete="off">
        <label for="url">Video URL</label>
        <input id="url" type="url" inputmode="url" placeholder="https://example.com/watch?v=..." required maxlength="2048">

        <div class="row">
            <div class="field">
                <label for="format">Format</label>
                <select id="format">
                    <option value="best">Best quality (may be separate video + audio)</option>
                    <option value="best_single">Best single file (video + audio)</option>
                    <option value="audio">Audio only</option>
                    <option value="video">Video only</option>
                    <option value="worst">Lowest quality</option>
                    <option value="custom">Custom yt-dlp selector…</option>
                </select>
            </div>
            <div class="field hidden" id="customWrap">
                <label for="custom">Custom selector</label>
                <input id="custom" type="text" placeholder="bv*[height<=720]+ba/b" maxlength="200">
            </div>
            <label class="toggle"><input id="metaOnly" type="checkbox"> Metadata only</label>
            <button id="submit" type="submit">Get video</button>
        </div>
    </form>

    <div id="statusCard" class="card hidden" role="status" aria-live="polite">
        <div class="status-head">
            <span id="dot" class="dot queued"></span>
            <span id="stageLabel" class="stage-label">Queued</span>
            <span id="statusBadge" class="badge">queued</span>
        </div>
        <div id="statusMessage" class="subtitle" style="margin-bottom:0"></div>
        <div id="bar" class="bar indeterminate"><span></span></div>
        <ul id="stages" class="stages"></ul>
        <div id="taskMeta" class="meta"></div>
    </div>
    <div id="message" class="msg hidden" role="alert"></div>

    <section id="result" class="hidden">
        <div class="card">
            <div class="summary">
                <img id="thumb" class="thumb hidden" alt="Video thumbnail" referrerpolicy="no-referrer">
                <div class="info">
                    <h2 id="title"></h2>
                    <dl id="details"></dl>
                </div>
            </div>
            <div id="notes"></div>
        </div>

        <div class="card" id="mediaCard">
            <h3>Download</h3>
            <div class="row" style="margin:0 0 14px">
                <div class="field"><label for="container">Video format</label>
                    <select id="container"><option value="auto">Auto (best fit)</option><option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WebM</option></select></div>
                <div class="field"><label for="convert">Audio format</label>
                    <select id="convert"><option value="original">Original (no conversion)</option><option value="mp3">MP3</option><option value="m4a">M4A (AAC)</option><option value="opus">Opus</option><option value="ogg">OGG Vorbis</option><option value="flac">FLAC</option><option value="wav">WAV</option><option value="aac">AAC</option></select></div>
            </div>
            <div id="primary"></div>
            <div id="media"></div>
        </div>

        <div class="card">
            <h3>Formats <span id="formatCount" class="badge"></span></h3>
            <div class="table-wrap">
                <table>
                    <thead><tr>
                        <th>ID</th><th>Type</th><th>Ext</th><th>Resolution</th><th>FPS</th>
                        <th>Video codec</th><th>Audio codec</th><th>Bitrate</th><th>Size</th><th>Get</th>
                    </tr></thead>
                    <tbody id="formats"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <details class="json-card">
                <summary>JSON result</summary>
                <div class="json-actions">
                    <button type="button" id="copyJson" class="secondary">Copy JSON</button>
                    <button type="button" id="copyDownload" class="secondary hidden">Copy Download URL</button>
                </div>
                <pre id="json" class="json"></pre>
            </details>
        </div>
    </section>
</main>
<!--FOOTER-->

<script>
(function () {
    "use strict";
    var API_URL = "/api/v1/extract/";
    var $ = function (id) { return document.getElementById(id); };

    var form = $("form"), submitBtn = $("submit");

    $("format").addEventListener("change", function () {
        $("customWrap").classList.toggle("hidden", this.value !== "custom");
    });

    function el(tag, opts, children) {
        var node = document.createElement(tag);
        opts = opts || {};
        if (opts.text !== undefined) node.textContent = opts.text;
        if (opts.cls) node.className = opts.cls;
        (children || []).forEach(function (c) { if (c) node.appendChild(c); });
        return node;
    }

    function showMessage(kind, text) {
        var box = $("message");
        box.textContent = text;
        box.className = "msg " + kind;
    }
    function clearMessage() { $("message").className = "msg hidden"; }

    function fmtDuration(sec) {
        if (typeof sec !== "number") return null;
        sec = Math.round(sec);
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        var pad = function (n) { return String(n).padStart(2, "0"); };
        return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
    }
    function fmtBytes(n) {
        if (typeof n !== "number") return null;
        var units = ["B", "KB", "MB", "GB", "TB"], i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return n.toFixed(i ? 1 : 0) + " " + units[i];
    }
    function fmtCount(n) { return typeof n === "number" ? n.toLocaleString() : null; }
    function dash(v) { return v === null || v === undefined || v === "" ? "—" : String(v); }
    function isHttp(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }

    function addDetail(dl, label, value, link) {
        if (value === null || value === undefined || value === "") return;
        dl.appendChild(el("dt", { text: label }));
        var dd = el("dd");
        if (link && isHttp(link)) {
            var a = el("a", { text: value });
            a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer";
            dd.appendChild(a);
        } else { dd.textContent = value; }
        dl.appendChild(dd);
    }

    function render(d) {
        $("title").textContent = d.title || "(untitled)";
        var thumb = $("thumb"), t = (d.thumbnails && d.thumbnails[0] && d.thumbnails[0].url) || d.thumbnail;
        if (isHttp(t)) { thumb.src = t; thumb.classList.remove("hidden"); } else { thumb.removeAttribute("src"); thumb.classList.add("hidden"); }

        var dl = $("details"); dl.textContent = "";
        var st = d.stats || {};
        addDetail(dl, "Platform", (d.platform && (d.platform.name || d.platform.key)));
        addDetail(dl, "Type", d.result_type);
        addDetail(dl, "Video ID", d.id);
        addDetail(dl, "Uploader", d.uploader, d.uploader_url);
        addDetail(dl, "Channel", d.channel, d.channel_url);
        addDetail(dl, "Duration", fmtDuration(d.duration));
        addDetail(dl, "Uploaded", d.upload_date);
        addDetail(dl, "Views", fmtCount(st.view_count));
        addDetail(dl, "Likes", fmtCount(st.like_count));
        addDetail(dl, "Comments", fmtCount(st.comment_count));
        addDetail(dl, "Language", d.language);
        addDetail(dl, "Live", d.live_status && d.live_status !== "not_live" ? d.live_status : (d.is_live ? "live" : null));
        addDetail(dl, "Categories", d.categories && d.categories.join(", "));
        addDetail(dl, "Tags", d.tags && d.tags.slice(0, 12).join(", "));
        if (d.subtitles) {
            var langs = (d.subtitles.manual_languages || []).length, auto = (d.subtitles.automatic_languages || []).length;
            addDetail(dl, "Subtitles", d.subtitles.available ? langs + " manual, " + auto + " automatic" : "none");
        }
        addDetail(dl, "Page", d.webpage_url, d.webpage_url);
        if (d.result_type === "playlist") addDetail(dl, "Entries", d.entry_count);

        var notes = $("notes"); notes.textContent = "";
        (d.notes || []).forEach(function (n) { notes.appendChild(el("div", { cls: "msg note", text: n })); });

        renderMedia(d);
        renderFormats(d);
        $("result").classList.remove("hidden");
    }

    function copyText(text, btn) {
        var done = function () { var old = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = old; }, 1500); };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        } else { fallbackCopy(text); done(); }
    }
    function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
    }

    function expiryBadge(exp) {
        if (!exp) return null;
        if (exp.status === "known" && exp.expires_at) return el("span", { cls: "badge warn", text: "Expires " + new Date(exp.expires_at).toLocaleString() });
        if (exp.status === "likely_temporary") return el("span", { cls: "badge warn", text: "Likely temporary (signed URL)" });
        return el("span", { cls: "badge", text: "Lifetime unknown" });
    }

    function renderPrimary(d) {
        var box = $("primary"); box.textContent = "";
        var info = d.download_url_info || {};
        if (d.result_type !== "playlist" && !d.metadata_only && currentTask && (isHttp(d.download_url) || (d.media && d.media.streams))) {
            var big = el("a", { cls: "btn big", text: "\u2B07  Download video" });
            mkDl(big, null, isAudioSel(d) ? "audio-only" : "video+audio");
            box.appendChild(big);
            box.appendChild(el("div", { cls: "dl-hint", text: "The file is fetched by the server and saved by your browser." }));
        }
        if (isHttp(d.download_url)) {
            var raw = el("details", {}, [el("summary", { text: "Direct URL" }), el("div", { cls: "url-box", text: d.download_url })]);
            box.appendChild(raw);
            var badges = el("div", { cls: "stream-head" }, [el("div", {}, [
                info.contents ? el("span", { cls: "badge", text: info.contents }) : null,
                info.format_id ? el("span", { cls: "badge", text: "ID " + info.format_id }) : null,
                info.is_manifest ? el("span", { cls: "badge warn", text: "manifest (HLS/DASH)" }) : null,
                info.requires_headers ? el("span", { cls: "badge warn", text: "needs headers" }) : null,
                info.requires_cookies ? el("span", { cls: "badge warn", text: "needs cookies" }) : null,
                expiryBadge(info.expiry),
                el("span", { cls: "badge", text: "not verified" })
            ])]);
            badges.style.marginTop = "8px";
            box.appendChild(badges);
        } else {
            box.appendChild(el("div", { cls: "subtitle", text: "download_url: null" }));
        }
        if (d.download_url_note) box.appendChild(el("div", { cls: "msg note", text: d.download_url_note }));
    }

    function renderMedia(d) {
        renderPrimary(d);
        var box = $("media"); box.textContent = "";
        var card = $("mediaCard");
        if (!d.media || !d.media.streams) {
            card.classList.remove("hidden");
            if (d.result_type === "playlist" && d.entries) {
                d.entries.forEach(function (e) {
                    var row = el("div", { cls: "stream" });
                    row.appendChild(el("div", { text: e.index + ". " + (e.title || e.id || "(untitled)") }));
                    if (isHttp(e.url)) {
                        var a = el("a", { text: e.url }); a.href = e.url; a.target = "_blank"; a.rel = "noopener noreferrer";
                        row.appendChild(a);
                        var use = el("button", { cls: "secondary", text: "Use this URL" });
                        use.type = "button";
                        use.style.marginLeft = "8px";
                        use.addEventListener("click", function () { $("url").value = e.url; window.scrollTo({ top: 0, behavior: "smooth" }); });
                        row.appendChild(use);
                    }
                    box.appendChild(row);
                });
            }
            return;
        }
        card.classList.remove("hidden");
        box.appendChild(el("h3", { text: "Selected streams" }));
        box.appendChild(el("div", { cls: "msg note", text: "These URLs are often temporary, signed, or tied to your IP address and request headers. Re-extract if one stops working." }));
        d.media.streams.forEach(function (s) {
            var head = el("div", { cls: "stream-head" }, [
                el("div", {}, [
                    el("span", { cls: "badge", text: s.role }),
                    el("span", { cls: "badge", text: "ID " + dash(s.format_id) }),
                    el("span", { cls: "badge", text: [s.ext, s.resolution].filter(Boolean).join(" · ") || "—" }),
                    s.is_manifest ? el("span", { cls: "badge warn", text: "manifest (HLS/DASH)" }) : null,
                    s.requires_headers ? el("span", { cls: "badge warn", text: "needs headers" }) : null,
                    s.requires_cookies ? el("span", { cls: "badge warn", text: "needs cookies" }) : null,
                    expiryBadge(s.expiry)
                ])
            ]);
            var sdl = el("a", { cls: "btn secondary", text: "Download" });
            mkDl(sdl, s.format_id, s.role === "audio" ? "audio-only" : "video+audio"); head.appendChild(sdl);
            var copy = el("button", { cls: "secondary", text: "Copy URL" });
            copy.type = "button";
            copy.addEventListener("click", function () { copyText(s.download_url, copy); });
            head.appendChild(copy);

            var stream = el("div", { cls: "stream" }, [head, el("div", { cls: "url-box", text: s.download_url })]);
            var hdrs = s.http_headers || {};
            if (Object.keys(hdrs).length) {
                var det = el("details");
                det.appendChild(el("summary", { text: "Request headers" }));
                det.appendChild(el("pre", { text: Object.keys(hdrs).map(function (k) { return k + ": " + hdrs[k]; }).join("\n") }));
                stream.appendChild(det);
            }
            box.appendChild(stream);
        });
    }

    function renderFormats(d) {
        var body = $("formats"); body.textContent = "";
        var list = d.formats || [];
        $("formatCount").textContent = list.length;
        var picked = (d.selected && d.selected.format_ids) || [];
        list.forEach(function (f) {
            var tr = document.createElement("tr");
            if (picked.indexOf(f.format_id) !== -1) tr.className = "picked";
            var br = typeof f.tbr === "number" ? Math.round(f.tbr) + " kbps" : (typeof f.abr === "number" ? Math.round(f.abr) + " kbps" : null);
            var res = f.resolution || (f.width && f.height ? f.width + "x" + f.height : null);
            [f.format_id, f.kind, f.ext, res, f.fps, f.vcodec, f.acodec, br,
             fmtBytes(f.filesize) || (fmtBytes(f.filesize_approx) ? "~" + fmtBytes(f.filesize_approx) : null)
            ].forEach(function (v) { tr.appendChild(el("td", { text: dash(v) })); });
            var urlCell = el("td");
            if (isHttp(f.download_url) && currentTask) {
                var da = el("a", { cls: "btn secondary", text: "Download" });
                mkDl(da, f.format_id, f.kind); da.style.marginRight = "6px";
                urlCell.appendChild(da);
            }
            if (isHttp(f.download_url)) {
                var cb = el("button", { cls: "secondary", text: "Copy" });
                cb.type = "button"; cb.style.padding = "3px 8px";
                cb.addEventListener("click", function () { copyText(f.download_url, cb); });
                urlCell.appendChild(cb);
            } else { urlCell.textContent = "—"; }
            tr.appendChild(urlCell);
            body.appendChild(tr);
        });
        if (!list.length) {
            var tr = document.createElement("tr");
            var td = el("td", { text: "No formats reported." }); td.colSpan = 10;
            tr.appendChild(td); body.appendChild(tr);
        }
    }

    // ---- live task handling -------------------------------------------------
    var API = "/api/v1/extract/";
    var POLL_MS = 1000, MAX_POLL_MS = 10 * 60 * 1000, MAX_NET_FAILS = 4;
    var poll = null;       // { timer, id, started, fails }
    var lastResponse = null;
    var currentTask = null;
    var DL = "/api/v1/download/";
    function dlHref(fid, kind) {
        var q = [];
        if (fid) q.push("format_id=" + encodeURIComponent(fid));
        var cont = $("container").value, conv = $("convert").value;
        if (kind === "audio-only") { if (conv !== "original") q.push("convert=" + conv); }
        else if (cont !== "auto") q.push("container=" + cont);
        return DL + encodeURIComponent(currentTask) + "/" + (q.length ? "?" + q.join("&") : "");
    }
    function mkDl(a, fid, kind) { a.dataset.fid = fid || ""; a.dataset.kind = kind; a.href = dlHref(fid, kind); }
    function isAudioSel(d) { var st = (d.media && d.media.streams) || []; return st.length > 0 && st.every(function (x) { return x.role === "audio"; }); }
    document.addEventListener("click", function (e) {
        var a = e.target.closest && e.target.closest("a.btn[data-kind]");
        if (a) a.href = dlHref(a.dataset.fid, a.dataset.kind);   // pick up the latest output options
    }, true);

    function stopPolling() { if (poll) { clearTimeout(poll.timer); poll = null; } }

    function setBusy(busy) { submitBtn.disabled = busy; }

    function errText(body, status) {
        if (body && body.error && body.error.message) return body.error.message + (body.error.retryable ? " (You can retry.)" : "");
        if (body && Array.isArray(body.detail)) return "Invalid request: " + body.detail.map(function (x) { return x.msg; }).join("; ");
        return "Request failed (HTTP " + status + ").";
    }

    function renderStatus(st) {
        $("statusCard").classList.remove("hidden");
        $("dot").className = "dot " + st.status;
        $("stageLabel").textContent = st.stage_label || st.stage;
        $("statusBadge").textContent = st.status;
        $("statusMessage").textContent = st.message || "";
        var bar = $("bar");
        if (st.status === "completed") bar.className = "bar done";
        else if (st.status === "failed") bar.className = "bar failed";
        else if (typeof st.progress === "number") { bar.className = "bar"; bar.firstElementChild.style.width = Math.round(st.progress * 100) + "%"; }
        else bar.className = "bar indeterminate";   // progress is null: no percentage is available

        var list = $("stages"); list.textContent = "";
        (st.history || []).forEach(function (h, i, arr) {
            var li = el("li", { text: h.label || h.stage });
            if (st.status === "failed" && i === arr.length - 1) li.className = "failed";
            else if (st.status !== "completed" && i === arr.length - 1) li.className = "current";
            list.appendChild(li);
        });
        $("taskMeta").textContent = "Task " + st.task_id + " · created " + new Date(st.created_at).toLocaleTimeString() +
            (st.completed_at ? " · finished " + new Date(st.completed_at).toLocaleTimeString() : "");
    }

    function showJson(obj) {
        lastResponse = obj;
        $("json").textContent = JSON.stringify(obj, null, 2);
        var dl = obj && obj.data && obj.data.download_url;
        $("copyDownload").classList.toggle("hidden", !isHttp(dl));
    }

    function fetchResult(id) {
        fetch(API + "result/" + encodeURIComponent(id) + "/", { headers: { "Accept": "application/json" } })
            .then(function (r) { return r.json().catch(function () { return null; }).then(function (b) { return { r: r, b: b }; }); })
            .then(function (x) {
                if (x.b) showJson(x.b);
                if (x.r.ok && x.b && x.b.status === "completed") {
                    render(x.b.data);
                    showMessage("success", "Extraction completed.");
                } else {
                    $("result").classList.remove("hidden");
                    $("mediaCard").classList.add("hidden");
                    showMessage("error", errText(x.b, x.r.status));
                }
            })
            .catch(function () { showMessage("error", "Could not retrieve the result. Check your connection and try again."); })
            .then(function () { setBusy(false); });
    }

    function pollStatus(id) {
        if (!poll || poll.id !== id) return;   // superseded by a newer task
        fetch(API + "status/" + encodeURIComponent(id) + "/", { headers: { "Accept": "application/json" }, cache: "no-store" })
            .then(function (r) { return r.json().catch(function () { return null; }).then(function (b) { return { r: r, b: b }; }); })
            .then(function (x) {
                if (!poll || poll.id !== id) return;
                if (x.r.status === 404) {
                    stopPolling(); setBusy(false);
                    showMessage("error", "This task is unknown or has expired. Please start a new extraction.");
                    return;
                }
                if (!x.r.ok || !x.b) { throw new Error("bad status response"); }
                poll.fails = 0;
                renderStatus(x.b);
                if (x.b.status === "completed" || x.b.status === "failed") {
                    stopPolling();
                    fetchResult(id);
                    return;
                }
                if (Date.now() - poll.started > MAX_POLL_MS) {
                    stopPolling(); setBusy(false);
                    showMessage("error", "Stopped waiting: the task is taking unusually long.");
                    return;
                }
                poll.timer = setTimeout(function () { pollStatus(id); }, POLL_MS);
            })
            .catch(function () {
                if (!poll || poll.id !== id) return;
                poll.fails += 1;
                if (poll.fails >= MAX_NET_FAILS) {
                    stopPolling(); setBusy(false);
                    showMessage("error", "Lost contact with the server while checking status.");
                    return;
                }
                poll.timer = setTimeout(function () { pollStatus(id); }, POLL_MS * 2);
            });
    }

    document.addEventListener("click", function (e) {
        var a = e.target.closest && e.target.closest("a.btn[href*='/download/']");
        if (a) showMessage("success", "Starting download\u2026 your browser will save it as soon as the server connects.");
    });
    $("copyJson").addEventListener("click", function () { if (lastResponse) copyText(JSON.stringify(lastResponse, null, 2), this); });
    $("copyDownload").addEventListener("click", function () {
        var u = lastResponse && lastResponse.data && lastResponse.data.download_url;
        if (isHttp(u)) copyText(u, this);
    });

    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        stopPolling();
        clearMessage();
        $("result").classList.add("hidden");
        $("statusCard").classList.add("hidden");
        lastResponse = null;

        var url = $("url").value.trim();
        if (!url) { showMessage("error", "Please enter a video URL."); return; }
        var fmt = $("format").value === "custom" ? $("custom").value.trim() : $("format").value;
        if (!fmt) { showMessage("error", "Please enter a custom format selector."); return; }

        setBusy(true);
        fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ url: url, metadata_only: $("metaOnly").checked, format: fmt })
        }).then(function (resp) {
            return resp.json().catch(function () { return null; }).then(function (body) { return { resp: resp, body: body }; });
        }).then(function (r) {
            if (r.resp.ok && r.body && r.body.task_id) {
                renderStatus(r.body.task);
                var id = r.body.task_id; currentTask = id;
                poll = { id: id, started: Date.now(), fails: 0, timer: null };
                pollStatus(id);
                return;
            }
            setBusy(false);
            showMessage("error", errText(r.body, r.resp.status));
        }).catch(function () {
            setBusy(false);
            showMessage("error", "Could not reach the server. Check your connection and try again.");
        });
    });
})();
</script>
</body>
</html>
